# Room 26 on Netlify: a static site, no build step.
[build]
  publish = "."
  command = ""
  edge_functions = "netlify/edge-functions"

# Each post has its own address (/p/<id>). It's the same page; the share-preview
# edge function adds that post's link-preview tags before it's sent.
[[redirects]]
  from = "/p/*"
  to = "/index.html"
  status = 200

# Don't serve the setup files as web pages
[[redirects]]
  from = "/netlify/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/serve.ps1"
  to = "/"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The page itself always checks for updates; versioned files (?v=) and the logo cache long
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
